name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, typecheck, lint, format-check and unit-test the CLI package.
  #
  # The network-free integration tests (git, index, cli, daemon) run in the
  # `integration` job below. The embedding integration tests drive a real model
  # download and stay out of CI; run them locally with `npm run test:integration`.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm

      # @zvec/zvec ships prebuilt native bindings as optionalDependencies
      # (darwin/linux, x64/arm64), so `npm ci` on these runners installs a
      # matching prebuilt binary; no compiler toolchain is required.
      - run: npm ci

      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      # The README's headline numbers are written by bench/report.mjs from raw
      # run data. CONTRIBUTING says no number there may be hand-edited; this is
      # what makes that enforceable rather than merely asked for.
      - name: README numbers match the measurements
        run: node bench/report.mjs --check
      # The site's CLI reference tables are generated from `git why -h`. Checked
      # here rather than in the site job because this job already has the built
      # CLI the tables come from; the site job would have to install and build
      # the whole package a second time to ask the same question. The
      # hand-maintained version had drifted to fourteen flags out of
      # twenty-seven, with every temporal flag missing.
      - name: Site CLI reference matches --help
        run: node site/scripts/gen-cli-reference.mjs --check

  # Real git repositories, real Zvec collections, real child processes and the
  # daemon; no network and no embedding model (test/integration/embedding is
  # excluded). The unit job cannot see lock races, refresh recovery or
  # argv/stdout behaviour, which is where the audited bugs lived.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run test:integration:offline

  # The declared engines floor (Node 22.12) is otherwise never exercised: CI and
  # release both run 24. Build with the current toolchain, then run the unit
  # suite on the oldest supported runtime.
  engines-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build:test
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
      - name: Unit tests on the engines floor
        run: node --test --test-concurrency=4 ".tmp/tsc-test/test/unit/**/*.test.js"

  # Smoke-test that the documentation site still builds. The real deploy
  # happens in pages.yml, on pushes to main only.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      # Anchors are the half that rots silently: renaming a heading changes its
      # generated id, and every deep link to it quietly lands in the wrong
      # place with nothing failing.
      - name: Internal links and anchors resolve
        run: node site/scripts/check-links.mjs

  # Packaging is verified separately because it is the check most likely to
  # catch a release-breaking mistake that unit tests cannot see: a file missing
  # from the tarball, a lost shebang, a man page that does not land where
  # install.sh looks for it, or `git why --help` failing to dispatch through
  # Git. It needs no network and no embedding model, so unlike the integration
  # suite it is a reliable always-green gate.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-package.mjs
      - name: Shell completions are emitted for every supported shell
        run: |
          for sh in bash zsh fish; do
            node dist/cli/main.js completion "$sh" > /dev/null
          done
      - name: Plugin manifests are valid JSON with the required fields
        run: node scripts/verify-plugins.mjs
