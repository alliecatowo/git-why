name: Dependabot auto-merge

# Standard pattern from GitHub's docs ("Automating Dependabot with GitHub Actions").
# Patch and minor updates are approved and set to auto-merge; GitHub then merges
# them only once the branch's REQUIRED status checks pass (see the `require-ci`
# ruleset), so a PR that breaks CI never lands. Major updates are labelled and
# left for a human. pull_request_target is safe here: this job never checks out
# or runs code from the PR, it only reads Dependabot's metadata.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only development dependencies and GitHub Actions are merged on CI alone.
      # A runtime dependency (the native @zvec/zvec binding) ships to every user,
      # so a patch/minor bump of it is labelled for a human instead.
      - name: Approve and enable auto-merge (patch and minor, dev deps and actions only)
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          (steps.metadata.outputs.dependency-type == 'direct:development' || steps.metadata.outputs.package-ecosystem == 'github_actions')
        run: |
          gh pr review --approve "$PR_URL" || echo "approval not possible, relying on required checks only"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label runtime and major updates for manual review
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          (steps.metadata.outputs.dependency-type != 'direct:development' && steps.metadata.outputs.package-ecosystem != 'github_actions')
        run: |
          gh label create major-update --color D93F0B --description "Runtime or major version bump, needs a human" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label major-update
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
