name: Release

# Fires only on a version tag, so cutting a release is `git tag v0.1.0 &&
# git push --tags` and nothing else. It never runs on a branch push: there is
# no path from ordinary development to an accidental publish.
on:
  push:
    tags: ['v*']
  # Re-run the post-publish jobs (GitHub release, MCP registry, Homebrew) for a
  # tag whose npm publish already succeeded. The publish job itself never runs
  # from here, so a version cannot be published twice.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v0.1.2'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # npm trusted publishing: registered on npmjs.com for this repo, workflow
    # release.yml and environment `npm`. No long-lived registry token is used.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The tag is the claim; package.json is the fact. Publishing a v0.1.1
      # tag from a tree that still says 0.1.0 would ship the wrong version
      # under the right name, which is unrecoverable once it is on the
      # registry.
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi
          server="$(node -p 'require("./server.json").version')"
          if [ "$server" != "$pkg" ]; then
            echo "server.json version ${server} does not match package.json version ${pkg}" >&2
            exit 1
          fi
          echo "releasing ${pkg}"

      # The same gates CI runs, re-run here rather than trusted from the
      # branch build: a tag can point at any commit, including one CI never
      # saw.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: node scripts/verify-package.mjs
      - run: node scripts/verify-plugins.mjs

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node's bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.0 && npm --version
      - name: Publish to npm
        run: npm publish --provenance --access public

  github-release:
    needs: publish
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.publish.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'

      # Attach exactly what npm serves, rather than a tarball packed on the side.
      - name: Fetch the published tarball
        run: |
          VERSION="${TAG_NAME#v}"
          # The registry CDN can 404 a fresh publish for 10+ minutes.
          for attempt in $(seq 1 45); do
            npm pack "@alliecatowo/git-why@${VERSION}" --pack-destination . && break
            sleep 20
          done
          ls -l ./*.tgz

      - name: Attach the tarball to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG_NAME}" ./*.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "${TAG_NAME}" \
            --notes "See CHANGELOG.md for what changed, and docs/report.md for the measurements behind it."

  # MCP registry entry (registry.modelcontextprotocol.io) for
  # io.github.alliecatowo/git-why. Authenticates with GitHub OIDC, so no token.
  # The registry checks that the published npm package carries the matching
  # `mcpName`, which is why this runs after `publish`.
  publish-mcp:
    name: Publish to the MCP registry
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.publish.result) && !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
      id-token: write
    steps:
      # Push: the tag's tree. Dispatch: the default branch, so a fixed server.json
      # can be republished for a tag whose npm package is already out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: server.json matches the tag
        run: |
          tag="${TAG_NAME#v}"
          server="$(node -p 'require("./server.json").version')"
          [ "$tag" = "$server" ] || { echo "server.json ${server} != tag ${tag}" >&2; exit 1; }
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
      # Re-runs must be harmless: the registry rejects a duplicate version with a
      # 400, which used to turn a repeat dispatch red. Ask first; skip if present.
      - name: Is this version already in the registry?
        id: existing
        run: |
          version="${TAG_NAME#v}"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/io.github.alliecatowo%2Fgit-why/versions/${version}")"
          if [ "$code" = "200" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "io.github.alliecatowo/git-why ${version} is already published; nothing to do."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
      # The binary runs with id-token: write, so it is verified against the
      # checksum published for this exact release rather than trusted off the wire.
      - name: Install mcp-publisher
        if: steps.existing.outputs.present != 'true'
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1"
          curl -fsSL -o mcp-publisher.tar.gz "${base}/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in with GitHub OIDC
        if: steps.existing.outputs.present != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        if: steps.existing.outputs.present != 'true'
        run: ./mcp-publisher publish

  # Homebrew formula in alliecatowo/homebrew-tap. Renders Formula/git-why.rb
  # pointing at the tarball just published to npm (std_npm_args install, node
  # dependency) and pushes it over SSH with a write deploy key (secret
  # HOMEBREW_TAP_DEPLOY_KEY, no PAT). Skipped for pre-release tags.
  update-homebrew:
    name: Update Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.publish.result) && !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
    steps:
      - name: Render and push Formula/git-why.rb
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY secret is not set; cannot update the tap"
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          URL="https://registry.npmjs.org/@alliecatowo/git-why/-/git-why-${VERSION}.tgz"
          # The registry can take a moment to serve a fresh publish.
          curl --fail --silent --show-error --location --retry 90 --retry-delay 10 \
            --retry-all-errors "$URL" -o git-why.tgz
          SHA="$(sha256sum git-why.tgz | cut -d' ' -f1)"

          cat > git-why.rb <<EOF
          # Homebrew formula for git-why, a Node CLI published to npm as @alliecatowo/git-why.
          # Generated by the update-homebrew job in alliecatowo/git-why
          # (.github/workflows/release.yml) on each stable release. Do not edit by hand.
          class GitWhy < Formula
            desc "Semantic archaeology for Git. Find the history that explains the code"
            homepage "https://github.com/alliecatowo/git-why"
            url "${URL}"
            sha256 "${SHA}"
            license "Apache-2.0"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink libexec.glob("bin/*")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/git-why --version")
            end
          end
          EOF

          install -d -m 700 ~/.ssh
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $keyfile -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone --depth 1 git@github.com:alliecatowo/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp git-why.rb tap/Formula/git-why.rb
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "Tap already up to date; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-why.rb
          git commit -m "git-why ${VERSION}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
