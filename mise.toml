[tools]
node = "24.21.0"
gh = "2.100.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.setup]
description = "Install dependencies from the lockfile and run doctor"
run = ["npm ci --no-audit --fund=false || npm install --no-audit --fund=false", "node scripts/doctor.mjs"]

[tasks.doctor]
description = "Verify tools, native deps, Git capabilities, benchmark prerequisites"
run = "node scripts/doctor.mjs"

[tasks.build]
description = "Compile the package"
run = "npm run build"

[tasks.check]
description = "Format, lint, typecheck and required functional tests"
depends = ["build"]
run = "npm run check"

[tasks."test:integration"]
description = "Real repositories, storage, locks, recovery, edge cases"
depends = ["build"]
run = "npm run test:integration"

[tasks."test:package"]
description = "Pack, install into a clean prefix, invoke through Git"
depends = ["build"]
run = "node scripts/verify-package.mjs"

[tasks."spike:capabilities"]
description = "Execute dependency and runtime probes"
run = "node --experimental-strip-types spike/run.ts"

[tasks.demo]
description = "Rebuild the demo repository and run the README queries against it"
depends = ["build"]
run = "node scripts/demo.mjs"

[tasks."bench:retrieval"]
description = "Run the frozen retrieval comparison"
depends = ["build"]
run = "node bench/retrieval/run.mjs"

[tasks."bench:perf"]
description = "Run the bounded CLI/system measurements"
depends = ["build"]
run = "node bench/perf/run.mjs"

[tasks."bench:corpus"]
description = "Rebuild the 174-case derived corpus and score every baseline against it"
depends = ["build"]
run = [
  "node bench/corpus/extract.mjs",
  "node bench/corpus/paraphrase.mjs",
  "node bench/corpus/gate.mjs",
  "node bench/corpus/baselines.mjs",
]

[tasks."bench:index-size"]
description = "Measure index size per record across the pinned real clones"
depends = ["build"]
run = "node bench/index-size.mjs"

[tasks."bench:embedders"]
description = "Compare embedding models on a fixed pool: potion variants against BGE and Jina"
depends = ["build"]
run = [
  "node bench/embedders/build-pool.mjs",
  "node bench/embedders/score.mjs --report",
]

[tasks."bench:diagnose"]
description = "Where do gold commits rank, and why are the missing ones missing?"
depends = ["build"]
run = [
  "node bench/corpus/rank-profile.mjs --depth 50",
  "node bench/corpus/recall-probe.mjs",
]

[tasks."bench:rerank-lab"]
description = "Evaluate reranking variants offline over already-retrieved candidates"
run = "node bench/corpus/rerank-lab.mjs"

[tasks."bench:crossfile"]
description = "Score the cross-file causal corpus, where git log -S wins"
depends = ["build"]
run = "node bench/corpus/crossfile.mjs"

[tasks."bench:agents:smoke"]
description = "Run the 16 free-model smoke trials"
depends = ["build"]
run = "node bench/agents/run.mjs --stage=smoke"

[tasks."bench:agents:pilot"]
description = "Run the 64 free-model pilot trials"
depends = ["build"]
run = "node bench/agents/run.mjs --stage=pilot"

[tasks."bench:models"]
description = "Compare arms across every model that has completed a pilot"
run = "node bench/compare-models.mjs"

[tasks."bench:freeze"]
description = "Verify bench/protocol.json still matches its own hash"
run = "node bench/freeze-protocol.mjs"

[tasks."bench:report"]
description = "Generate tables and the report from saved records"
run = "node bench/report.mjs"

[tasks."site:check"]
description = "Build the site, then verify every internal link and anchor resolves"
depends = ["site:build"]
run = "node site/scripts/check-links.mjs"

[tasks."verify:plugins"]
description = "Validate both plugin manifests, their MCP commands and skill frontmatter"
run = "node scripts/verify-plugins.mjs"

[tasks.casts]
description = "Re-record the asciinema demos; --only <name> for one scenario"
depends = ["build"]
run = "node scripts/record-casts.mjs"

[tasks."repo:create"]
description = "Idempotently create/verify and push the authorized public repository"
run = "node scripts/repo-create.mjs"

[tasks."site:install"]
description = "Install the docs/marketing site's own dependencies (never touches the root dependency tree)"
run = "npm install --prefix site --no-audit --fund=false"

[tasks."site:dev"]
description = "Run the VitePress site locally with hot reload"
depends = ["site:install"]
run = "npm run --prefix site dev"

[tasks."site:build"]
description = "Build the static site to site/.vitepress/dist"
depends = ["site:install"]
run = "npm run --prefix site build"
